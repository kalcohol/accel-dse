[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accel-dse"
version = "0.53.0"
description = "Analytical design-space exploration for LLM inference accelerators: models as released, mapping as a design variable, exact layout/batch search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tx wang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
accel-dse = "accel_dse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["accel_dse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
accel_dse = ["data/*.json", "data/releases/*.json", "data/pipeline/*.json", "web/*"]
