[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accel-dse"
version = "0.31.1"
description = "Analytical design-space exploration (DSE) workbench for inference-only NPU/ASIC: LLM / video DiT / protein, HBM/LPDDR, multi-chip TP/PP/EP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tx wang" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
accel-dse = "accel_dse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["accel_dse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
accel_dse = ["data/*.json", "web/*"]
